[project]
name = "sitepulse"
version = "0.1.0"
description = "Professional site reliability monitoring with FastAPI and Streamlit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "apscheduler>=3.10.4",
    "sqlalchemy>=2.0.36",
    "pydantic[email]>=2.10.0",
    "httpx>=0.28.0",
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    "pandas>=2.2.3",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.122.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
